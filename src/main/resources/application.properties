spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration

server.error.include-stacktrace=always
server.error.path=/error

logging.level.root=INFO
logging.level.com.example.weather=TRACE

# Supplied by the environment - no default, so a missing value fails at startup
# rather than surfacing as a runtime "unable to get conditions" response.
# Get a key at weatherapi.com, then export WEATHER_API_KEY (bin/setenv.sh on Tomcat).
weather.api.key=${WEATHER_API_KEY}

# Tell Spring Boot to leverage Tomcat's native header handling.
# These server.* properties configure the EMBEDDED connector only, so they apply
# to spring-boot:run and `java -jar weather.war`. When this war is deployed to an
# external Tomcat, Boot does not build the connector and they are ignored - the
# equivalent valve lives in src/main/webapp/META-INF/context.xml.
server.forward-headers-strategy=native

# Define the standard headers Tomcat should look for
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
